<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Iffa × Hisham | Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --ivory: #fbfaf7;
      --baby-blue: #edf8ff;
      --soft-blue: #d5edfb;
      --dusty-blue: #8ebbd8;
      --navy: #27495f;
      --deep-navy: #183747;
      --text: #334955;
      --muted: #748995;
      --white: #ffffff;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        radial-gradient(
          circle at 0% 0%,
          rgba(207,234,255,0.75) 0%,
          transparent 32%
        ),
        radial-gradient(
          circle at 100% 100%,
          rgba(218,240,255,0.75) 0%,
          transparent 30%
        ),
        linear-gradient(
          180deg,
          #fffdfa 0%,
          #f7fbfd 50%,
          #f1f9fd 100%
        );

      color: var(--text);

      font-family:
        Georgia,
        "Times New Roman",
        serif;
    }

    .admin-shell {
      width: min(100%, 470px);

      text-align: center;
    }

    .small-title {
      margin-bottom: 16px;

      color: var(--dusty-blue);

      font-family:
        Arial,
        sans-serif;

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 5px;
    }

    h1 {
      margin: 0 0 12px;

      color: var(--navy);

      font-size:
        clamp(48px, 10vw, 68px);

      font-weight: normal;

      line-height: 0.95;

      letter-spacing: -2px;
    }

    .x-symbol {
      color: var(--dusty-blue);
      font-style: italic;
    }

    .subtitle {
      margin-bottom: 28px;

      color: var(--muted);

      font-family:
        Arial,
        sans-serif;

      font-size: 14px;

      line-height: 1.6;
    }

    .login-card {
      padding: 30px 28px;

      background:
        rgba(255,255,255,0.88);

      border:
        1px solid
        rgba(142,187,216,0.30);

      border-radius: 26px;

      box-shadow:
        0 22px 60px
        rgba(39,73,95,0.10);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .login-card h2 {
      margin: 0 0 22px;

      color: var(--navy);

      font-size: 22px;
      font-weight: normal;
    }

    input {
      width: 100%;

      padding: 15px 16px;

      margin-bottom: 12px;

      border:
        1px solid
        rgba(142,187,216,0.35);

      border-radius: 14px;

      background:
        rgba(255,255,255,0.96);

      color: var(--text);

      font-family:
        Arial,
        sans-serif;

      font-size: 15px;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    input:focus {
      border-color: var(--dusty-blue);

      box-shadow:
        0 0 0 4px
        rgba(142,187,216,0.13);
    }

    button {
      width: 100%;

      min-height: 50px;

      margin-top: 6px;

      border: none;

      border-radius: 999px;

      background:
        linear-gradient(
          135deg,
          #4d829f,
          #27495f
        );

      color: white;

      font-family:
        Arial,
        sans-serif;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 10px 25px
        rgba(39,73,95,0.18);

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 14px 30px
        rgba(39,73,95,0.24);
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    #loginStatus {
      min-height: 24px;

      margin-top: 16px;

      color: var(--navy);

      font-family:
        Arial,
        sans-serif;

      font-size: 13px;

      line-height: 1.5;
    }

    .footer {
      margin-top: 30px;

      color: #8aa4b3;

      font-family:
        Arial,
        sans-serif;

      font-size: 10px;
      font-weight: 600;

      letter-spacing: 3px;
    }

    @media (max-width: 520px) {

      body {
        padding: 16px;
      }

      .login-card {
        padding: 26px 20px;
        border-radius: 22px;
      }

      h1 {
        font-size: 48px;
      }

      input {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="admin-shell">

    <div class="small-title">
      WEDDING GALLERY ADMIN
    </div>

    <h1>
      Iffa
      <span class="x-symbol">×</span>
      Hisham
    </h1>

    <div class="subtitle">
      Sign in to manage wedding memories.
    </div>


    <section class="login-card">

      <h2>
        Admin Login
      </h2>

      <input
        type="email"
        id="adminEmail"
        placeholder="Admin email"
        autocomplete="email"
      >

      <input
        type="password"
        id="adminPassword"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        type="button"
        id="loginButton"
      >
        Sign In
      </button>

      <div id="loginStatus"></div>

    </section>


    <div class="footer">
      IFFA × HISHAM • ADMIN
    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="admin.js"></script>

</body>
</html>
